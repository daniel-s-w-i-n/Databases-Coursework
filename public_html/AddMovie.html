    <script>
      function show(ID)
      {
          var elem = document.getElementById(ID);
          elem.style.visibility = "visible" ;
      }     
      function hide(ID)
      {
          var elem = document.getElementById(ID);
          elem.style.visibility = "hidden" ;
      }        

      function validate(name)
    {
        check[0] = name.aMovieName.value;
        if (check == '')
        {
            alert("No Movie inputed");            /*Checks to see if the value is empty before passing it inefficiently*/
            return False;
        }
        check[1] = name.aActorName.value;
        if (check == '')
        {
            alert("No Actor inputed");            
            return False;
        }
        check[2] = name.aYear.value;
        if (check == '')
        {
            alert("No Year inputed");           
            return False;
        }
        check[3] = name.aPrice.value;
        if (check == '')
        {
            alert("No Price inputed");           
            return False;
        }
        check[4] = name.aGenre.value;
        if (check == '')
        {
            alert("No Genre inputed");           
            return False;
        }
        for (i=0;i!=4;i++)
        {
            for (j=0;j!=4;j++)
            {
                if(check[i] = check[j]);
                {
                    alert("Two are the same"); /*incase they have typed a value in twice*/
                    return False;
                }
            }
        }
        
        return True;
    } 
  </script>
